<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>로그인 | TickDeal</title><link rel="stylesheet" href="css/style.css"></head><body><div id="site-header"></div><main class="wrap"><section class="auth"><h1>다시 만나 반가워요</h1><p>로그인하고 오늘의 좋은 딜을 만나보세요.</p><form id="login-form"><label class="field"><span>이메일</span><input id="email" type="email" autocomplete="email" required placeholder="이메일 주소를 입력해 주세요"></label><label class="field"><span>비밀번호</span><input id="password" type="password" autocomplete="current-password" required placeholder="비밀번호를 입력해 주세요"></label><button id="login-submit" class="btn btn-red btn-full">로그인</button></form><p class="center small" style="margin-top:25px">아직 회원이 아니신가요? <a class="red" href="signup.html">회원가입 →</a></p></section></main><div id="site-footer"></div><script src="js/common.js"></script><script src="js/auth.js"></script></body></html>
