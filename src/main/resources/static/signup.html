<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>회원가입 | TickDeal</title><link rel="stylesheet" href="css/style.css"></head><body><div id="site-header"></div><main class="wrap"><section class="auth"><h1>좋은 딜의 시작, 틱딜</h1><p>회원가입하고 나만의 쇼핑 타이밍을 찾아보세요.</p><form id="signup-form"><label class="field"><span>이메일</span><input id="email" type="email" autocomplete="email" required></label><label class="field"><span>비밀번호</span><input id="password" type="password" autocomplete="new-password" minlength="8" required></label><label class="field"><span>비밀번호 확인</span><input id="password2" type="password" autocomplete="new-password" minlength="8" required></label><label class="field"><span>이름</span><input id="name" type="text" required></label><button id="signup-submit" class="btn btn-red btn-full">동의하고 회원가입</button></form><p class="center small" style="margin-top:25px">이미 계정이 있으신가요? <a class="red" href="login.html">로그인 →</a></p></section></main><div id="site-footer"></div><script src="js/common.js"></script><script src="js/auth.js"></script></body></html>
