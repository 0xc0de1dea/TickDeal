services:
  mysql:
    image: mysql:8.0
    container_name: mysql2-compose

    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: nbcam

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - spring-net

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p1234"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7
    container_name: redis2-compose

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    networks:
      - spring-net

    command: redis-server --appendonly yes

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  spring:
    build: .
    container_name: spring2-compose

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      DATASOURCE_URL: jdbc:mysql://mysql:3306/nbcam?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DATASOURCE_USERNAME: root
      DATASOURCE_PASSWORD: 1234

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

    ports:
      - "8080:8080"

    networks:
      - spring-net

volumes:
  mysql_data:
  redis_data:

networks:
  spring-net: